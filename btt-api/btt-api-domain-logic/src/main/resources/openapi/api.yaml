openapi: 3.0.3
info:
  title: BTT Domain API
  version: 1.0.0
  description: Контракты каталога перевозок, регистрации перевозчиков и бронирования билетов.
paths:
  /api/v1/auth/token:
    post:
      tags: [Auth]
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema: {"$ref": "#/components/schemas/Login"}
      responses:
        '200':
          description: Токен доступа
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/AccessToken"}
        '401':
          description: Неверный логин или пароль
  /api/v1/users:
    post:
      tags:
      - Users
      operationId: registerUser
      summary: Зарегистрировать нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterUser"
      responses:
        '201':
          description: Профиль пользователя создан
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserAccountDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '409':
          description: Логин или адрес электронной почты уже используется
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiError"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/users/{id}":
    get:
      tags:
      - Users
      operationId: getUser
      summary: Получить профиль пользователя
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserAccountDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/users/{userId}/roles":
    get:
      tags:
      - Users
      operationId: listUserRoles
      summary: Получить роли пользователя
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/RoleDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporter-organizations":
    get:
      tags:
      - Catalog
      operationId: listTransporterOrganizations
      summary: Организации перевозчиков
      parameters:
      - name: search
        in: query
        schema: {type: string, maxLength: 255}
        description: Фрагмент названия или точное значение ИНН или ОГРН
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransporterOrganizationDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporter-organizations/{id}":
    get:
      tags:
      - Catalog
      operationId: getTransporterOrganization
      summary: Организации перевозчиков по идентификатору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterOrganizationDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transport-kinds":
    get:
      tags:
      - Catalog
      operationId: listTransportKinds
      summary: Виды транспорта
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransportKindDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transport-kinds/{id}":
    get:
      tags:
      - Catalog
      operationId: getTransportKind
      summary: Виды транспорта по идентификатору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransportKindDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporters":
    get:
      tags:
      - Catalog
      operationId: listTransporters
      summary: Перевозчики
      parameters:
      - name: organizationId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: transportKindId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransporterDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporters/{id}":
    get:
      tags:
      - Catalog
      operationId: getTransporter
      summary: Перевозчики по идентификатору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/routes":
    get:
      tags:
      - Catalog
      operationId: listRoutes
      summary: Маршруты
      parameters:
      - name: transportKindId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/RouteDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/routes/{id}":
    get:
      tags:
      - Catalog
      operationId: getRoute
      summary: Маршруты по идентификатору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RouteDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/trips":
    get:
      tags:
      - Trips
      operationId: listTrips
      summary: Рейсы
      parameters:
      - name: routeId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: transporterId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: source
        in: query
        description: Пункт отправления
        schema: {type: string, maxLength: 255}
      - name: destination
        in: query
        description: Пункт назначения
        schema: {type: string, maxLength: 255}
      - name: carrier
        in: query
        description: Название организации перевозчика
        schema: {type: string, maxLength: 255}
      - name: transportKindId
        in: query
        description: Вид транспорта
        schema: {type: string, format: uuid}
      - name: departureFrom
        in: query
        description: Нижняя граница отправления, включительно
        schema: {type: string, format: date-time}
      - name: departureUntil
        in: query
        description: Верхняя граница отправления, исключительно
        schema: {type: string, format: date-time}
      - name: maxPrice
        in: query
        description: Максимальная цена места
        schema: {type: number, minimum: 0}
      - name: bookableOnly
        in: query
        description: Только будущие рейсы со свободными местами
        schema: {type: boolean, default: false}
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TripDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/trips/{id}":
    get:
      tags:
      - Trips
      operationId: getTrip
      summary: Рейсы по идентификатору
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TripDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporters/{transporterId}/licenses":
    get:
      tags:
      - Catalog
      operationId: listTransporterLicenses
      summary: Лицензии перевозчика
      parameters:
      - name: transporterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransporterLicenseDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests":
    get:
      tags:
      - Registration
      operationId: listRegistrationRequests
      summary: Заявления перевозчиков
      parameters:
      - name: transporterId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: integer
          format: int32
          description: 0 — черновик, 1 — подано, 2 — на рассмотрении, 3 — одобрено, 4 — отклонено, 5 — отозвано, 6 — на согласовании, 7 — на доработке.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '501':
          "$ref": "#/components/responses/NotImplemented"
    post:
      tags:
      - Registration
      operationId: createRegistrationRequest
      summary: Создать черновик заявления
      description: >-
        Инициатор определяется по текущему пользователю. Представитель перевозчика
        может создать заявление типов 1, 2 и 3 для своей организации.
        Тип 4 доступен администрации портала. Для типа 1 передаются
        organizationId и transporterData без transporterId. Для типа 2 передаются
        transporterId и полный снимок transporterData. Для типов 3 и 4 требуется transporterId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateTransporterRequest"
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '403':
          description: Пользователю недоступен выбранный вид заявления для этого перевозчика
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiError"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests/{id}":
    get:
      tags:
      - Registration
      operationId: getRegistrationRequest
      summary: Получить заявление
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests/{requestId}/submit":
    post:
      tags:
      - Registration
      operationId: submitRegistrationRequest
      summary: Подать заявление
      description: Допустимо для черновика.
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests/{requestId}/assign-executor":
    post:
      tags:
      - Registration
      operationId: assignRegistrationRequestExecutor
      summary: Назначить исполнителя
      description: Допустимо для поданного заявления. Заявление переходит на рассмотрение.
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AssignRequestExecutor"
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests/{requestId}/withdraw":
    post:
      tags:
      - Registration
      operationId: withdrawRegistrationRequest
      summary: Отозвать заявление
      description: Отозвать заявление может только податель, после подачи и до согласования решения, включая доработку.
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransporterRequestDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-requests/{requestId}/decision":
    get:
      tags:
      - Registration
      operationId: getRegistrationDecision
      summary: Получить решение по заявлению
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DecisionDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
    post:
      tags:
      - Registration
      operationId: issueRegistrationDecision
      summary: Вынести решение по заявлению
      description: Исполнитель передаёт решение на согласование. При доработке создаётся новая редакция решения.
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IssueDecision"
      responses:
        '201':
          description: Ресурс создан
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DecisionDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/transporters/{transporterId}/registration-certificate":
    get:
      tags:
      - Registration
      operationId: getRegistrationCertificate
      summary: Получить свидетельство перевозчика
      parameters:
      - name: transporterId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationCertificateDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-certificates/{certificateId}/versions":
    get:
      tags:
      - Registration
      operationId: listCertificateVersions
      summary: История версий свидетельства
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/RegistrationCertificateVersionDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/registration-certificates/{certificateId}/versions/{versionId}":
    get:
      tags:
      - Registration
      operationId: getCertificateVersion
      summary: Получить версию свидетельства
      parameters:
      - name: certificateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegistrationCertificateVersionDto"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '404':
          "$ref": "#/components/responses/NotFound"
        '501':
          "$ref": "#/components/responses/NotImplemented"
  "/api/v1/tickets":
    get:
      tags:
      - Tickets
      operationId: listTickets
      summary: Билеты текущего пользователя
      parameters:
      - name: tripId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
